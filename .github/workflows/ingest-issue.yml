name: Ingest Approved Food Issue

on:
  issues:
    types: [labeled]

# Serialize all approved-food pushes onto main. Per-issue groups raced when
# several foods were approved in one pass and lost non-fast-forward pushes.
concurrency:
  group: ingest-main
  cancel-in-progress: false

jobs:
  ingest-food:
    if: github.event.label.name == 'approved-food'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Parse Issue JSON & Write Atomic File
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/ingest-issue.mjs
      - name: Validate food item schema + IDs
        run: npm run validate-data
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        env:
          VITE_BASE: /
          VITE_GITHUB_OWNER: iammenasco
          VITE_GITHUB_REPO: flarewise
        run: npm run build
      - name: Commit and push to main
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/items
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 1
          fi
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          git commit -m "feat(data): add food from issue #${ISSUE_NUMBER}" \
            -m "Automated ingestion from approved issue #${ISSUE_NUMBER}."
          # Production build dirties public/ (catalog export) without committing it.
          # A dirty tree blocks `git pull --rebase` on the non-fast-forward retry path
          # (seen 2026-11-10 bulk approve: "cannot pull with rebase: You have unstaged changes").
          git reset --hard HEAD
          # Rebase if another serialized ingest (or a late main tip) landed first.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Push still rejected after retries."
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Close issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ github.event.issue.number }}" \
            --comment "Ingested and pushed to \`main\` as \`${{ steps.commit.outputs.sha }}\`. Deploy follows from that push."
      - name: Comment on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "Ingest failed for \`approved-food\` (validation or push). Nothing new was left on \`main\`. Fix the issue body if needed, then remove and re-apply \`approved-food\` to retry. Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
