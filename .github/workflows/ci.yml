name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate food item schema + IDs
        run: npm run validate-data
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        env:
          VITE_BASE: /
          VITE_GITHUB_OWNER: iammenasco
          VITE_GITHUB_REPO: flarewise
        run: npm run build
