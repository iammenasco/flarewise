<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Soft brand wash so iOS status / Dynamic Island chrome matches the page, not white. -->
    <meta name="theme-color" content="#e8f2fb" />
    <script>
      (() => {
        try {
          const raw = localStorage.getItem('flarewise_theme')
          const pref = raw ? JSON.parse(raw) : 'system'
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          const theme =
            pref === 'light' || pref === 'dark' ? pref : systemDark ? 'dark' : 'light'
          const color = theme === 'dark' ? '#0f2740' : '#e8f2fb'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          const svg = document.querySelector('link[rel="icon"][type="image/svg+xml"]')
          if (svg) svg.href = theme === 'dark' ? '/favicon-dark.svg' : '/favicon.svg'
          for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
            meta.setAttribute('content', color)
          }
        } catch (_) {}
      })()
    </script>
    <meta
      name="description"
      content="Flarewise — Crohn's-friendly food catalog. Dial how today feels, browse gentle foods, and share picks with friends."
    />
    <link rel="canonical" href="https://flarewise.menas.co/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flarewise" />
    <meta property="og:title" content="Flarewise" />
    <meta
      property="og:description"
      content="Crohn's-friendly food catalog. Dial how today feels, browse gentle foods, star favorites, and keep a grocery list — offline on your phone."
    />
    <meta property="og:url" content="https://flarewise.menas.co/" />
    <meta property="og:image" content="https://flarewise.menas.co/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Flarewise — Crohn's-friendly food catalog on your phone"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Flarewise" />
    <meta
      name="twitter:description"
      content="Crohn's-friendly food catalog. Dial how today feels, browse gentle foods, and share picks."
    />
    <meta name="twitter:image" content="https://flarewise.menas.co/og.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Draw under the status bar; our soft-blue page bg fills the island notch. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flarewise" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Flarewise</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
